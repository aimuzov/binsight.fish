name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: fish on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Reuse verified CI
        id: verified
        uses: aimuzov/infra-ci/reuse-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/ci.yml
          matrix: ${{ toJSON(matrix) }}
      - uses: actions/checkout@v5
        if: steps.verified.outputs.reused != 'true'

      - name: Install fish from the release PPA
        if: steps.verified.outputs.reused != 'true' && (runner.os == 'Linux')
        run: |
          sudo add-apt-repository -y ppa:fish-shell/release-4
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Install fish from homebrew
        if: steps.verified.outputs.reused != 'true' && (runner.os == 'macOS')
        run: brew install fish

      # The fixtures keep package metadata in JSON, and jq is what reads it
      - name: Make sure jq is present
        run: jq --version
        if: steps.verified.outputs.reused != 'true'

      - name: Report the version under test
        run: fish --version
        if: steps.verified.outputs.reused != 'true'

      - name: Check the syntax of every fish file
        run: fish --no-config -n functions/*.fish completions/*.fish tests/*.fish
        if: steps.verified.outputs.reused != 'true'

      - name: Install fishtape
        run: |
          fish -c 'curl -sSL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source
                   fisher install jorgebucaran/fisher jorgebucaran/fishtape'
        if: steps.verified.outputs.reused != 'true'

      - name: Run the tests
        run: fish -c 'fishtape tests/*.test.fish'
        if: steps.verified.outputs.reused != 'true'
      - name: Record verified CI
        if: github.event_name == 'pull_request' && steps.verified.outputs.reused != 'true'
        uses: aimuzov/infra-ci/record-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/ci.yml
          matrix: ${{ toJSON(matrix) }}
permissions:
  contents: read
  actions: read
  id-token: write
